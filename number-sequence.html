<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Sequence | PuzzleVerse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">PuzzleVerse</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#games">Games</a>
            <a href="index.html#about">About</a>
        </div>

        <button id="theme-toggle">🌙</button>
    </nav>

    <main class="sequence-page">
        <div class="sequence-container">

            <h1>Number Sequence</h1>

            <p class="sequence-subtitle">
                Find the missing number and solve the pattern!
            </p>

            <!-- Difficulty -->
            <div class="sequence-settings">
                <label for="difficulty">Difficulty:</label>

                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>

                <button id="start-game">Start Game</button>
            </div>

            <!-- Game Information -->
            <div class="sequence-info">
                <div class="sequence-info-box">
                    <span>Score</span>
                    <strong id="sequence-score">0</strong>
                </div>

                <div class="sequence-info-box">
                    <span>Question</span>
                    <strong id="question-number">0/10</strong>
                </div>

                <div class="sequence-info-box">
                    <span>Time</span>
                    <strong id="sequence-timer">15</strong>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="sequence-progress">
                <div id="progress-bar"></div>
            </div>

            <!-- Question Area -->
            <section id="sequence-game" class="sequence-game">

                <h2>Find the Missing Number</h2>

                <div id="number-sequence" class="number-sequence">
                    Start the game to begin!
                </div>

                <div id="sequence-options" class="sequence-options">
                    <!-- Options generated by JavaScript -->
                </div>

                <p id="sequence-message"></p>

                <button id="next-question" disabled>
                    Next Question
                </button>

            </section>

            <!-- Result Screen -->
            <section id="sequence-result" class="sequence-result">

                <h2>Quiz Completed!</h2>

                <p>Your Final Score</p>

                <strong id="final-score">0/10</strong>

                <p id="result-message"></p>

                <button id="play-again">
                    Play Again
                </button>

            </section>

        </div>
    </main>

    <script src="script.js"></script>
    <script src="games/number-sequence.js"></script>

</body>
</html>
